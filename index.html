<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Benja | Portfolio</title>
  </head>

  <body class="bg-[#0D1117] font-sans text-white">
    <header
      class="sticky top-0 z-50 grid grid-cols-[1fr_auto] items-center gap-4 bg-[#0D1117] px-6 py-4 lg:grid-cols-[1fr_auto_1fr]"
    >
      <a
        href="#home"
        class="text-xl font-bold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >Benjamín Rodríguez</a
      >

      <!-- MENÚ DE IDIOMAS -->
      <div
        class="col-start-2 row-start-1 flex items-center justify-self-end gap-3 lg:col-start-3"
      >
        <div class="relative">
          <button
            id="language-toggle"
            type="button"
            aria-label="Seleccionar idioma"
            aria-controls="language-options"
            aria-expanded="false"
            data-i18n-label="selectLanguage"
            class="flex min-h-11 items-center gap-2 rounded px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              class="h-6 w-6"
            >
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="4.5" ry="9" />
              <path d="M12 3v18" />
              <path d="M3 12h18" />
              <path d="M4.5 7c4.5 2 10.5 2 15 0" />
              <path d="M4.5 17c4.5-2 10.5-2 15 0" />
            </svg>
            <span id="current-language" aria-hidden="true">ES</span>
          </button>
          <div
            id="language-options"
            class="absolute top-full right-0 z-50 mt-2 hidden min-w-40 rounded-lg border border-white/10 bg-[#0D1117] p-2 shadow-xl"
          >
            <button
              type="button"
              lang="es"
              data-language="es"
              aria-pressed="true"
              class="transition-colors duration-300 block min-h-11 w-full rounded px-3 py-2 text-left hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-[#E3FF6A] aria-pressed:text-[#E3FF6A]"
            >
              Español
            </button>

            <button
              type="button"
              lang="en"
              data-language="en"
              aria-pressed="false"
              class="transition-colors duration-300 block min-h-11 w-full rounded px-3 py-2 text-left hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-[#E3FF6A] aria-pressed:text-[#E3FF6A]"
            >
              English
            </button>

            <button
              type="button"
              lang="pt-BR"
              data-language="pt-BR"
              aria-pressed="false"
              class="transition-colors duration-300 block min-h-11 w-full rounded px-3 py-2 text-left hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-[#E3FF6A] aria-pressed:text-[#E3FF6A]"
            >
              Português
            </button>
          </div>
        </div>

        <a
          href="#contact"
          data-i18n="contact"
          class="hidden rounded bg-[#E3FF6A] px-4 py-2 font-semibold text-[#0D1117] transition-[background-color,box-shadow] duration-300 hover:bg-[#cbe35e] hover:shadow-[0_0_25px_rgba(227,255,106,0.6)] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A] lg:block"
        >
          Contacto
        </a>

        <button
          id="menu-toggle"
          type="button"
          aria-controls="main-navigation"
          aria-expanded="false"
          class="cursor-pointer rounded px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A] lg:hidden"
        >
          <span class="sr-only" data-i18n="mainMenu">Menú principal</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            class="h-6 w-6"
          >
            <path d="M4 6h16 M4 12h16 M4 18h16" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <nav
        id="main-navigation"
        aria-label="Navegación principal"
        data-i18n-label="navigation"
        class="absolute top-full right-6 z-50 hidden flex-col items-stretch gap-1.5 min-w-36 lg:gap-6 rounded-lg bg-[#0D1117] p-2 shadow-xl lg:static lg:col-start-2 lg:row-start-1 lg:flex lg:flex-row lg:items-center lg:rounded-none lg:bg-transparent lg:p-0 lg:shadow-none border border-white/10 lg:min-w-0 lg:border-0"
      >
        <a
          href="#about"
          data-i18n="about"
          class="text-right rounded px-3 py-2 hover:bg-white/5 lg:p-0 lg:text-left lg:hover:bg-transparent transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Sobre mí
        </a>

        <a
          href="#skills"
          data-i18n="skills"
          class="text-right rounded px-3 py-2 hover:bg-white/5 lg:p-0 lg:text-left lg:hover:bg-transparent transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Habilidades
        </a>

        <a
          href="#projects"
          data-i18n="projects"
          class="text-right rounded px-3 py-2 hover:bg-white/5 lg:p-0 lg:text-left lg:hover:bg-transparent transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Proyectos
        </a>

        <a
          href="#contact"
          data-i18n="contact"
          class="text-center rounded bg-[#E3FF6A] px-4 py-2 font-semibold text-[#0D1117] transition-[background-color,box-shadow] duration-300 lg:hidden hover:bg-[#cbe35e] hover:shadow-[0_0_25px_rgba(227,255,106,0.6)] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Contacto
        </a>
      </nav>
    </header>

    <main>
      <section id="home">
        <h1>Benjamín Rodríguez</h1>
        <p>Desarrollador frontend</p>
      </section>

      <section id="about">
        <h2>Sobre mí</h2>
      </section>

      <section id="skills">
        <h2>Mis habilidades</h2>
      </section>

      <section id="additional-skills">
        <h2>Habilidades adicionales</h2>
      </section>

      <section id="projects">
        <h2>Mis proyectos</h2>
      </section>

      <section id="contact">
        <h2>Contacto</h2>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Benjamín Rodríguez</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
