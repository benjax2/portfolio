<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Benja | Portfolio</title>
  </head>

  <body class="bg-[#0D1117] font-sans text-white">
    <header
      class="flex flex-col gap-4 px-6 py-4 md:flex-row md:items-center md:justify-between"
    >
      <a
        href="#home"
        class="text-xl font-bold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >Benjamín Rodríguez</a
      >

      <button
        id="menu-toggle"
        type="button"
        aria-controls="main-navigation"
        aria-expanded="false"
        class="self-start rounded px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A] md:hidden"
      >
        Menú
      </button>

      <nav
        id="main-navigation"
        aria-label="Navegación principal"
        class="hidden flex-col items-start gap-6 md:flex md:flex-row md:items-center"
      >
        <a
          href="#about"
          class="transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Sobre mí
        </a>

        <a
          href="#skills"
          class="transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Habilidades
        </a>

        <a
          href="#projects"
          class="transition-colors duration-300 hover:text-[#E3FF6A] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Proyectos
        </a>

        <a
          href="#contact"
          class="rounded bg-[#E3FF6A] px-4 py-2 font-semibold text-[#0D1117] transition-[background-color,box-shadow] duration-300 hover:bg-[#cbe35e] hover:shadow-[0_0_25px_rgba(227,255,106,0.6)] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#E3FF6A]"
        >
          Contacto
        </a>
      </nav>
    </header>

    <main>
      <section id="home">
        <h1>Benjamín Rodríguez</h1>
        <p>Desarrollador frontend</p>
      </section>

      <section id="about">
        <h2>Sobre mí</h2>
      </section>

      <section id="skills">
        <h2>Mis habilidades</h2>
      </section>

      <section id="additional-skills">
        <h2>Habilidades adicionales</h2>
      </section>

      <section id="projects">
        <h2>Mis proyectos</h2>
      </section>

      <section id="contact">
        <h2>Contacto</h2>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Benjamín Rodríguez</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
